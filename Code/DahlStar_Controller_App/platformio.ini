; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
lib_deps =
	; ArduinoBLE temporarily disabled — shares ESP32-S3 with WiFiS3 (BLE is Phase 4)
	; arduino-libraries/ArduinoBLE@^2.0.2
	waspinator/AccelStepper@^1.64
	olikraus/U8g2@^2.36.18
	; EEPROM.h and WiFiS3 are provided by the Renesas Arduino core — no extra lib entry needed
	; WiFiMDNS is bundled with the WiFiS3 package on the R4 WiFi core
